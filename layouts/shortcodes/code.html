{{ $height := .Get "height" | default "auto" }}
{{ $width := .Get "width" | default "100%" }}
{{ $lang := .Get "lang" | default "text" }}
{{ $label := .Get "label" | default $lang }}
{{ $align := .Get "align" | default "left" }}

<div class="custom-code-container" style="max-width: {{ $width }}; margin-left: {{ if eq $align " center" }}auto{{ else
    if eq $align "right" }}auto{{ else }}0{{ end }}; margin-right: {{ if eq $align "center" }}auto{{ else if eq
    $align "left" }}auto{{ else }}0{{ end }};">
    <div class="code-header">
        <span class="code-label">{{ $label }}</span>
        <div class="code-dots">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>
    <div class="custom-code-block" style="{{ if ne $height " auto" }}height: {{ $height }};{{ end }}">
        {{ highlight .Inner $lang "style=monokai" }}
    </div>
</div>
