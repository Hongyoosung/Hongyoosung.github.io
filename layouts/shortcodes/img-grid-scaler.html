<div class="grid grid-cols-1 md:grid-cols-[1.5fr_1fr] gap-8 my-10 items-start">
    <figure class="flex flex-col h-full">
        <div class="flex items-center justify-center bg-gray-50 rounded-lg overflow-hidden" style="height: 350px;">
            <img src="{{ .Get "src1" }}" 
                 alt="{{ .Get "alt1" | default "image 1" }}" 
                 class="w-full h-full object-cover modal-trigger cursor-pointer transition-transform hover:scale-[1.02]">
        </div>
        {{ with .Get "cap1" }}
        <figcaption class="mt-3 text-sm text-gray-500 italic font-sans text-center">
            {{ . }}
        </figcaption>
        {{ end }}
    </figure>

    <figure class="flex flex-col h-full">
        <div class="flex items-center justify-center bg-gray-50 rounded-lg overflow-hidden" style="height: 350px;">
            <img src="{{ .Get "src2" }}" 
                 alt="{{ .Get "alt2" | default "image 2" }}" 
                 class="w-full h-full object-cover modal-trigger cursor-pointer transition-transform hover:scale-[1.02]">
        </div>
        {{ with .Get "cap2" }}
        <figcaption class="mt-3 text-sm text-gray-500 italic font-sans text-center">
            {{ . }}
        </figcaption>
        {{ end }}
    </figure>
</div>
